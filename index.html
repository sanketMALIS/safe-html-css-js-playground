<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple online HTML, CSS and JavaScript playground with a live preview.">

    <title>Safe Code Playground</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header">
        <h1>Code Playground</h1>
        <p>Write code and preview your output.</p>
    </header>

    <main class="container">

        <section class="editor">

            <div class="code-panel">
                <label for="html-code">HTML</label>
                <textarea id="html-code" spellcheck="false"
                    aria-label="HTML code editor"><h1>Hello World!</h1>
<p>Welcome to my Code Playground.</p>
<button>Click Me</button></textarea>
            </div>

            <div class="code-panel">
                <label for="css-code">CSS</label>
                <textarea id="css-code" spellcheck="false"
                    aria-label="CSS code editor">body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
}

h1 {
    color: royalblue;
}

button {
    padding: 10px 20px;
    background: royalblue;
    color: white;
    border: none;
    border-radius: 5px;
}</textarea>
            </div>

            <div class="code-panel">
                <label for="js-code">JavaScript</label>
                <textarea id="js-code" spellcheck="false"
                    aria-label="JavaScript code editor">document.querySelector("button")
    .addEventListener("click", function () {
        alert("Hello! Your code is working.");
    });</textarea>
            </div>

            <button id="run-button" type="button">Run Code</button>

            <p id="status" role="status" aria-live="polite">
                Ready to run your code.
            </p>

        </section>

        <section class="preview-panel">
            <h2>Live Preview</h2>

            <iframe
                id="preview"
                title="Code output preview"
                sandbox="allow-scripts"
                referrerpolicy="no-referrer">
            </iframe>
        </section>

    </main>

    <footer>
        <p>Built with HTML, CSS and JavaScript.</p>
    </footer>

</body>
</html>
